name: Windows

on:
  push:
    paths:
      - "apps/windows/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "apps/windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build and test (Windows x64)
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python for Qt installer
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Qt 6.12
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.12.0"
          arch: win64_msvc2022_64
          cache: true
          setup-python: "false"

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: >
          cmake -S apps/windows -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" -DMXU_CORE_ONLY=OFF -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        run: ./apps/windows/scripts/package-windows.ps1 -QtRoot "$env:QT_ROOT_DIR" -BuildDir build -SkipTests

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: MxU-Slides-Windows-x64
          path: apps/windows/dist/MxU-Slides-Windows-x64.zip
          if-no-files-found: error
